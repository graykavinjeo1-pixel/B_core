[package]
name = "gpt-reference-evaluator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
semantic-core-adapters = { path = "../semantic-core-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

[[bin]]
name = "gpt-reference-evaluator"
path = "src/main.rs"

[[bin]]
name = "gpt-reference-runner"
path = "src/bin/gpt-reference-runner.rs"

[[bin]]
name = "gpt-reference-development-author"
path = "src/bin/gpt-reference-development-author.rs"

[[bin]]
name = "gpt-reference-final-sealer"
path = "src/bin/gpt-reference-final-sealer.rs"

[[bin]]
name = "gpt-reference-final-author"
path = "src/bin/gpt-reference-final-author.rs"

[[bin]]
name = "gpt-reference-surface-run-sealer"
path = "src/bin/gpt-reference-surface-run-sealer.rs"

[[bin]]
name = "gpt-reference-independent-input-sealer"
path = "src/bin/gpt-reference-independent-input-sealer.rs"
