[package]
name = "semantic-reasoning"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Repository-native bounded semantic reasoning and autonomous improvement runtime."
publish = false

[features]
# Normal builds expose only the production runtime. Preserve the complete
# sealed research surface behind an explicit feature for historical canaries,
# so active-core edits do not relint every immutable SEM implementation.
default = ["runtime-core"]
historical-campaigns = []
runtime-core = []

[lib]
name = "semantic_reasoning"
path = "src/lib.rs"

[[bin]]
name = "swe-knowledge-canary"
path = "src/swe_knowledge_canary_main.rs"

[[bin]]
name = "swe-issue-canary"
path = "src/swe_issue_canary_main.rs"

[[bin]]
name = "swe-capability-canary"
path = "src/swe_capability_canary_main.rs"

[[bin]]
name = "sem0-run"
path = "src/main.rs"
required-features = ["historical-campaigns"]

