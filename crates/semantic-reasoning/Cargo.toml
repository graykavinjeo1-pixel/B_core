[package]
name = "semantic-reasoning"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Closed-world SEM-0 executable semantic emergence experiment."
publish = false

[lib]
name = "semantic_reasoning"
path = "src/lib.rs"

[[bin]]
name = "sem0-run"
path = "src/main.rs"

[[bin]]
name = "sem1-run"
path = "src/sem1_main.rs"

[[bin]]
name = "sem2-run"
path = "src/sem2_main.rs"

[[bin]]
name = "sem3-run"
path = "src/sem3_main.rs"

[[bin]]
name = "sem4-run"
path = "src/sem4_main.rs"

[[bin]]
name = "sem5-run"
path = "src/sem5_main.rs"

[[bin]]
name = "sem6-run"
path = "src/sem6_main.rs"

[[bin]]
name = "sem6-freeze"
path = "src/sem6_freeze_main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
synapse-recursive-core = { path = "../synapse-recursive-core", version = "0.1.0" }

[lints]
workspace = true
