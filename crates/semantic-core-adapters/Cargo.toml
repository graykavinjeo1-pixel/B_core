[package]
name = "semantic-core-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Product and input/output adapters for the dockable semantic core."
publish = false

[lib]
name = "semantic_core_adapters"
path = "src/lib.rs"

[[bin]]
name = "language-adapter-canary"
path = "src/language_canary.rs"

[[bin]]
name = "generic-capability-canary"
path = "src/generic_capability_canary.rs"

[[bin]]
name = "cognitive-api-canary"
path = "src/cognitive_api_canary.rs"

[[bin]]
name = "conversation-cortex-canary"
path = "src/conversation_canary.rs"

[[bin]]
name = "pragmatic-reasoning-canary"
path = "src/pragmatic_reasoning_canary.rs"

[[bin]]
name = "pragmatic-context-canary"
path = "src/pragmatic_context_canary.rs"

[[bin]]
name = "compositional-language-canary"
path = "src/compositional_language_canary.rs"

[[bin]]
name = "discourse-program-canary"
path = "src/discourse_program_canary.rs"

[[bin]]
name = "cross-turn-discourse-canary"
path = "src/cross_turn_discourse_canary.rs"

[[bin]]
name = "semantic-role-discourse-canary"
path = "src/semantic_role_discourse_canary.rs"

[[bin]]
name = "attribution-discourse-canary"
path = "src/attribution_discourse_canary.rs"

[[bin]]
name = "epistemic-revision-canary"
path = "src/epistemic_revision_canary.rs"

[[bin]]
name = "modal-scope-canary"
path = "src/modal_scope_canary.rs"

[[bin]]
name = "discourse-qa-canary"
path = "src/discourse_qa_canary.rs"

[[bin]]
name = "temporal-discourse-canary"
path = "src/temporal_discourse_canary.rs"

[[bin]]
name = "conditional-guard-canary"
path = "src/conditional_guard_canary.rs"

[[bin]]
name = "b-core-cognitive-api"
path = "src/cognitive_api_main.rs"

[features]
# The adapter and semantic core remain Rust-only by default. PaddleOCR is an
# optional compatibility bridge for deployments that explicitly opt in to a
# local Python runtime.
default = []
python-paddle-ocr = []

[dependencies]
dockable-semantic-core = { path = "../dockable-semantic-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hwarang = { version = "0.2.0", default-features = false }
cfb = "0.14.0"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
