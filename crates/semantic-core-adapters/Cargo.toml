[package]
name = "semantic-core-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Product and input/output adapters for the dockable semantic core."
publish = false

[lib]
name = "semantic_core_adapters"
path = "src/lib.rs"

[[bin]]
name = "language-adapter-canary"
path = "src/language_canary.rs"

[[bin]]
name = "generic-capability-canary"
path = "src/generic_capability_canary.rs"

[[bin]]
name = "external-problem-adapter"
path = "src/external_problem_adapter_main.rs"

[dependencies]
dockable-semantic-core = { path = "../dockable-semantic-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true
