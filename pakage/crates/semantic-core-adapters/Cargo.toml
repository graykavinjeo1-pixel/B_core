[package]
name = "semantic-core-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Product and input/output adapters for the dockable semantic core."
publish = false

[lib]
name = "semantic_core_adapters"
path = "src/lib.rs"

[[bin]]
name = "language-adapter-canary"
path = "src/language_canary.rs"

[[bin]]
name = "generic-capability-canary"
path = "src/generic_capability_canary.rs"

[[bin]]
name = "cognitive-api-canary"
path = "src/cognitive_api_canary.rs"

[[bin]]
name = "b-core-cognitive-api"
path = "src/cognitive_api_main.rs"

[features]
# The adapter and semantic core remain Rust-only by default. PaddleOCR is an
# optional compatibility bridge for deployments that explicitly opt in to a
# local Python runtime.
default = []
python-paddle-ocr = []

[dependencies]
dockable-semantic-core = { path = "../dockable-semantic-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hwarang = { version = "0.2.0", default-features = false }
cfb = "0.14.0"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
