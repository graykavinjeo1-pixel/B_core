[workspace]
members = [
    "crates/dockable-semantic-core",
    "crates/semantic-core-adapters",
    "crates/synapse-core",
    "crates/synapse-recursive-core",
    "crates/semantic-reasoning",
    "crates/gpt-reference-evaluator",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"

# Regression tests validate behavior and do not consume native debugger
# symbols. On Windows, full debuginfo produced hundreds of MiB PDBs for every
# historical binary target and made linking the dominant validation cost.
[profile.test]
debug = 0
